name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # `@stable` is deliberate, and `rust-toolchain.toml` is what actually
      # decides the version. The action installs stable; rustup then honours the
      # file when cargo runs in this directory, so both runners end up on the
      # pinned toolchain regardless of what stable is that day.
      #
      # Do not "tidy" this to `@1.98` and do not delete the file. Pinning here
      # instead would pin CI only, and leave developer machines drifting -- which
      # is the bug the file exists to fix: a clippy lint that CI denied and that
      # did not exist on either developer machine passed locally and failed on
      # both runners.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # ARCHITECTURE.md is only worth writing if something fails when it is broken.
  # These are those somethings. Cheap (grep over the tree), no toolchain needed.
  architecture:
    name: architecture rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Architecture rules (ARCHITECTURE.md)
        run: ./scripts/check-architecture.sh
      - name: Single scene-render path (Rule 5)
        run: ./scripts/check-single-render-path.sh
      - name: One performance history (BENCHMARKS.md)
        run: ./scripts/check-benchmark-history.sh
      # Proves the two checks above still catch what they exist to catch --
      # a regex edit that silently stops matching would otherwise leave this
      # job green forever (CLAUDE.md "GitHub workflow — Repo facts").
      - name: Architecture rules self-test (every grep still trips)
        run: ./scripts/check-architecture-selftest.sh

  check:
    name: clippy + build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Test-quality audit #4 (2026-11-09, `handover/2026-11-09-windows`): every
    # GPU/golden test printed SKIP and returned `Ok` when `wgpu::Instance::
    # request_adapter` found no adapter, so a runner that silently lost its
    # adapter -- or never had one -- would go green having rendered zero
    # frames, and nothing would say so. Checked directly against this
    # workflow's own recent runs (`gh run view --job <id> --log`, the
    # "Golden image deltas" step only, which runs with `--nocapture`) before
    # setting this: all three matrix members print real `golden <name>: N%
    # differ` lines there, with no "SKIPPED"/"no GPU adapter" among them --
    # ubuntu-latest via the `mesa-vulkan-drivers` (lavapipe) install below,
    # macos-latest and windows-latest via whatever software/virtual adapter
    # their own OS exposes to wgpu, with no extra driver install needed. The
    # plain "Test" step below proves nothing either way about SKIP lines:
    # `cargo test` only shows captured output (including `eprintln!` SKIPs)
    # for a *failing* test, so a passing-but-silently-skipped test's SKIP
    # line is invisible there regardless of whether an adapter exists --
    # only the `--nocapture` step, or this `CUBARA_REQUIRE_GPU` switch
    # itself, can actually prove a test rendered something. All three
    # runners already have a real adapter today, so all three get the
    # switch; if a runner ever genuinely loses its adapter, this job should
    # go red instead of silently testing nothing (same reasoning as the
    # comment below on why these runners are not the perf-gate's
    # representative GPU -- that is about *performance* representativeness,
    # not adapter presence).
    env:
      CUBARA_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      # winit needs the X11/Wayland client libraries to link its windowing
      # backends, and wgpu needs a Vulkan ICD to find an adapter at all. The
      # runner has no GPU, so `mesa-vulkan-drivers` is what supplies one
      # (lavapipe, a software Vulkan implementation) -- without it
      # `request_adapter` returns None and every wgpu-touching test fails to
      # even start, not just runs slow.
      - name: Linux windowing + Vulkan dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev \
            mesa-vulkan-drivers vulkan-tools
      # `@stable` is deliberate, and `rust-toolchain.toml` is what actually
      # decides the version. The action installs stable; rustup then honours the
      # file when cargo runs in this directory, so both runners end up on the
      # pinned toolchain regardless of what stable is that day.
      #
      # Do not "tidy" this to `@1.98` and do not delete the file. Pinning here
      # instead would pin CI only, and leave developer machines drifting -- which
      # is the bug the file exists to fix: a clippy lint that CI denied and that
      # did not exist on either developer machine passed locally and failed on
      # both runners.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features
      - name: Build
        run: cargo build --workspace --all-targets
      # `--skip`: the radius-64 smoke test gets its own step below, which runs it
      # with output shown. Without the skip it ran *twice* per job -- once here
      # silently, once there -- doubling both its cost (the slowest single test
      # in CI, ~79s on the macOS runner) and its exposure to a timing flake, for
      # no extra coverage. See issue #138.
      #
      # `--no-fail-fast`: `cargo test` otherwise stops at the first *binary*
      # that fails, so one broken test crate (e.g. `cubara-app`'s unit tests)
      # hides every later one (`cubara-render`'s golden tests among them) --
      # exactly what happened investigating audit #4/#5: the macOS job's
      # `bench.rs` panic meant the golden-image regressions on the same run
      # never even got a chance to show up in this job's log.
      - name: Test
        run: cargo test --all --no-fail-fast -- --skip radius_64_world_load_settles_within_budget
      # Re-run just the golden tests with output shown. `cargo test` captures
      # stderr for *passing* tests, so without this the measured image deltas are
      # invisible until something already fails. The reference is generated on one
      # backend and checked on the others, so this line is how cross-backend drift
      # becomes visible while there is still headroom to react to it.
      - name: Golden image deltas
        run: cargo test -p cubara-render --test golden -- --nocapture
      # The phase-1 perf gate (--bench 64 >= 1000 FPS) does not run here -- these
      # runners have no representative GPU (ROADMAP.md phase 1 exit gate). This is
      # the CPU-only substitute (issue #89): the same radius-64 region streamed
      # and meshed with no GPU involved, bounded so a regression that turns
      # worldgen/meshing into a hang or an unbounded blow-up fails loudly instead
      # of quietly burning the job's time limit.
      #
      # --nocapture so the settle time is printed on a *passing* run, not only
      # when it fails: "is the margin shrinking?" should be a question with an
      # answer in the log. That is how the current budget was derived (#138).
      # This is the only place this test runs -- see the skip above.
      - name: Radius-64 world-load smoke test
        run: cargo test -p cubara-world --test radius_64_smoke -- --nocapture
